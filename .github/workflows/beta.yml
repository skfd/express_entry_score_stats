name: Deploy beta preview

# The github-pages environment only accepts deployments from main, so a push
# to beta asks the main deploy workflow to run; it builds beta into /beta/.
on:
  push:
    branches: [beta]

permissions:
  actions: write

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
