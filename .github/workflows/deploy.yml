name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Re-download data and redeploy every day at 6am UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Download latest data
        run: npm run download

      - name: Check for data changes
        id: check_changes
        run: |
          if ! diff <(jq -S 'del(.fetchedAt)' src/data/rounds.json) <(git show HEAD:src/data/rounds.json 2>/dev/null | jq -S 'del(.fetchedAt)' || echo '{}') > /dev/null 2>&1; then
            git add src/data/rounds.json
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New data detected"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new data found"
          fi

      - name: Commit new data
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Express Entry data - $(date +'%Y-%m-%d')"
          git push
          echo "GITHUB_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Generate visualization
        run: npm run generate

      # Design experiments, published under /lab/. An experiment that fails to
      # build must not take the live page down with it.
      - name: Build lab experiments
        continue-on-error: true
        run: npm run lab

      # Preview: the beta branch's generator, fed today's data, published at /beta/.
      # Only main may deploy to Pages, so pushes to beta re-run this workflow on
      # main (see beta.yml) instead of deploying themselves.
      - name: Build beta preview
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin beta > /dev/null; then
            git fetch --depth=1 origin beta
            git worktree add ../beta-src FETCH_HEAD
            cp src/data/rounds.json ../beta-src/src/data/rounds.json
            (cd ../beta-src && npm ci && BETA=1 npm run generate)
            mkdir -p dist/beta
            cp -r ../beta-src/dist/. dist/beta/
            echo "Beta preview built from $(git -C ../beta-src rev-parse --short HEAD)"
          else
            echo "No beta branch; skipping preview"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
